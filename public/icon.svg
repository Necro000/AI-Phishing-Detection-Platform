<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#2563eb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#60a5fa"/>
      <stop offset="80%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="shieldFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="radarSweep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.1"/>
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
    </filter>
  </defs>

  <!-- Ambient background cyber blur -->
  <circle cx="256" cy="240" r="180" fill="url(#cyberGlow)"/>

  <!-- Outer Protective Cyber Shield Aura -->
  <path d="M256 36 L436 96 C436 260 360 392 256 476 C152 392 76 260 76 96 Z" 
        fill="url(#shieldBorder)" 
        opacity="0.25" 
        filter="url(#softGlow)"/>

  <!-- Main Cyber Defense Shield -->
  <path d="M256 46 L424 102 C424 252 352 376 256 456 C160 376 88 252 88 102 Z" 
        fill="url(#shieldFill)" 
        stroke="url(#shieldBorder)" 
        stroke-width="8" 
        stroke-linejoin="round"/>

  <!-- Inner Cyber Grid Circuit Lines -->
  <g opacity="0.3" stroke="#38bdf8" stroke-width="1.5">
    <line x1="256" y1="60" x2="256" y2="440" stroke-dasharray="6 4"/>
    <line x1="120" y1="230" x2="392" y2="230" stroke-dasharray="6 4"/>
    <circle cx="256" cy="230" r="110" fill="none" stroke-dasharray="4 6"/>
    <circle cx="256" cy="230" r="65" fill="none" stroke-dasharray="3 5"/>
  </g>

  <!-- Radar Scanner Sweep Sector -->
  <path d="M256 230 L350 160 A110 110 0 0 1 366 230 Z" 
        fill="url(#radarSweep)"/>

  <!-- Center Threat Core (Shield Eye / Radar Pulse) -->
  <circle cx="256" cy="230" r="42" fill="#0369a1" fill-opacity="0.4" stroke="#38bdf8" stroke-width="3" filter="url(#neonGlow)"/>
  <circle cx="256" cy="230" r="22" fill="#0284c7" fill-opacity="0.7"/>
  <circle cx="256" cy="230" r="8" fill="#38bdf8"/>

  <!-- Detected Threat Lock Reticle Corner Brackets -->
  <path d="M196 170 H176 V190" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M316 170 H336 V190" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M196 290 H176 V270" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <path d="M316 290 H336 V270" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>

  <!-- Verified Security Check Crest -->
  <path d="M228 356 L248 376 L292 324" 
        fill="none" 
        stroke="#34d399" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>
</svg>
